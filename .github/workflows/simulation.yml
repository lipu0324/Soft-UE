name: deterministic simulation
on:
  push:
  pull_request:

jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - name: YAML dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Configure without hardware dependencies
        run: cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Debug -DSOFTUE_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build/cmake -j2
      - name: Test
        run: ctest --test-dir build/cmake --output-on-failure
      - name: Check traceability and prevent unsupported profile claims
        run: python3 scripts/check_requirements.py --output build/conformance.json
      - name: Preserve experiment and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-evidence-${{ matrix.sanitizers }}
          path: |
            build/conformance.json
            build/cmake/Testing/Temporary/
            build/simulation-test-*/

  reference-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned independent reference
        uses: actions/checkout@v4
        with:
          repository: ultraethernet/uet-ref-prov
          ref: 5b4e0491329b8e28764bca6847e2f6a0eaa84b9b
          path: build/uet-reference
      - name: Build libfabric 2.0.0 dependency
        shell: bash
        run: |
          curl -fL --retry 3 https://github.com/ofiwg/libfabric/releases/download/v2.0.0/libfabric-2.0.0.tar.bz2 -o build/libfabric.tar.bz2
          echo '1a8e40f1f331d6ee2e9ace518c0088a78c8a838968f8601c2b77fd012a7bf0f5  build/libfabric.tar.bz2' | sha256sum -c -
          tar -xjf build/libfabric.tar.bz2 -C build
          cd build/libfabric-2.0.0
          ./configure --enable-only --enable-sockets
          make -j2
      - name: Build the reference library and application
        run: make -C build/uet-reference -j2 LIBFABRIC="$GITHUB_WORKSPACE/build/libfabric-2.0.0" libuet_fabric.so uet
      - name: Configure independent protocol and provider tests
        run: >-
          cmake -S . -B build/reference-tests
          -DSOFTUE_REFERENCE_ROOT="$GITHUB_WORKSPACE/build/uet-reference"
          -DSOFTUE_LIBFABRIC_ROOT="$GITHUB_WORKSPACE/build/libfabric-2.0.0"
          -DSOFTUE_ENABLE_LIBFABRIC=ON
          -DSOFTUE_PROVIDER_LIBFABRIC_ROOT="$GITHUB_WORKSPACE/build/libfabric-2.0.0"
      - name: Build independent parser, endpoint processes and provider
        run: >-
          cmake --build build/reference-tests -j2 --target
          reference_wire_oracle reference_wire_fixtures reference_interop_target
          reference_interop_peer softue_fabric libfabric_provider_peer libfabric_datagram_peer
      - name: Compare parsing, run reference interop and exercise the public libfabric API
        run: >-
          ctest --test-dir build/reference-tests
          -R 'reference_wire_comparison|reference_process_interop|libfabric_provider_processes|libfabric_datagram_processes'
          --output-on-failure
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-wire-evidence
          path: build/reference-tests/Testing/Temporary/
